<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 272" width="1000" height="272" role="img" aria-label="llwan · AI 应用与 Node 服务端 · 线上实例 11wand.com">
<title>llwan · AI 应用与 Node 服务端 · 线上实例 11wand.com</title>
<defs>
  <linearGradient id="bgg-dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset="1" stop-color="#141d33"/>
  </linearGradient>
  <linearGradient id="brandg-dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b82f6"/>
    <stop offset="0.5" stop-color="#8a63f6">
      <animate attributeName="offset" values="0.5;0.86;0.5" dur="7s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="sweepg-dark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ea8ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#6ea8ff" stop-opacity="1"/>
    <stop offset="1" stop-color="#6ea8ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowAg-dark" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#3b82f6" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowBg-dark" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8a63f6" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#8a63f6" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gridg-dark" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#5b7bd6" stroke-width="1"/>
  </pattern>
  <clipPath id="frameg-dark">
    <rect x="1" y="1" width="998" height="270" rx="17"/>
  </clipPath>
  <clipPath id="cardclipg-dark">
    <rect x="640" y="44" width="312" height="188" rx="16"/>
  </clipPath>
</defs>

<style>
  .caret-dark   { animation: blink-dark 1.05s steps(1,end) infinite; }
  .ping-dark    { transform-box: fill-box; transform-origin: center;
                     animation: ping-dark 2.4s cubic-bezier(0,0,.2,1) infinite; }
  .pulse-dark   { animation: pulse-dark 2.4s ease-in-out infinite; }
  .sweep-dark   { animation: sweep-dark 5.5s linear infinite; }
  .ring-dark    { animation: ring-dark 3.2s ease-in-out infinite; }
  @keyframes blink-dark   { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  @keyframes ping-dark    { 0% { transform: scale(1); opacity: .75; }
                               70%,100% { transform: scale(2.9); opacity: 0; } }
  @keyframes pulse-dark   { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes sweep-dark   { 0% { transform: translateX(-180px); }
                               100% { transform: translateX(1030px); } }
  @keyframes ring-dark    { 0%,100% { stroke-opacity: .28; }
                               50% { stroke-opacity: .85; } }
  @media (prefers-reduced-motion: reduce) {
    .caret-dark, .ping-dark, .pulse-dark, .sweep-dark, .ring-dark { animation: none; }
  }
</style>

<g clip-path="url(#frameg-dark)">
  <rect width="1000" height="272" fill="url(#bgg-dark)"/>
  <rect width="1000" height="272" fill="url(#gridg-dark)" opacity="0.10"/>
  <ellipse cx="140" cy="24" rx="330" ry="210" fill="url(#glowAg-dark)"/>
  <ellipse cx="890" cy="296" rx="300" ry="180" fill="url(#glowBg-dark)"/>
  <!-- 底部扫光 -->
  <rect class="sweep-dark" x="0" y="269" width="180" height="3"
        fill="url(#sweepg-dark)" opacity="0.10"/>
</g>
<rect x="1" y="1" width="998" height="270" rx="17" fill="none"
      stroke="#2b3c60" stroke-width="2"/>

