<rect class="caret-light" x="290.55999999999995" y="184" width="3" height="19"
      rx="1.5" fill="#0057d9"/>
<text x="48" y="228" font-size="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', Roboto, Helvetica, Arial, sans-serif"
      fill="#5f7391">本地优先 · 数据自持 · 可自托管</text>

