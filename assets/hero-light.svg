<text x="128" y="102" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', Roboto, Helvetica, Arial, sans-serif"
      fill="#5f7391">AI 应用 &amp; Node 服务端 · 全栈独立开发</text>

