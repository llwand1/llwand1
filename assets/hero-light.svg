<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 272" width="1000" height="272" role="img" aria-label="llwan · AI 应用与 Node 服务端 · 线上实例 11wand.com">
<title>llwan · AI 应用与 Node 服务端 · 线上实例 11wand.com</title>
<defs>
  <linearGradient id="bgg-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f1f6fd"/>
  </linearGradient>
  <linearGradient id="brandg-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#007aff"/>
    <stop offset="0.5" stop-color="#6d4ae0">
      <animate attributeName="offset" values="0.5;0.86;0.5" dur="7s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#0ea5e9"/>
  </linearGradient>
  <linearGradient id="sweepg-light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0057d9" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#0057d9" stop-opacity="1"/>
    <stop offset="1" stop-color="#0057d9" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glowAg-light" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#007aff" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#007aff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowBg-light" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#6d4ae0" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#6d4ae0" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gridg-light" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#3b6fd4" stroke-width="1"/>
  </pattern>
  <clipPath id="frameg-light">
    <rect x="1" y="1" width="998" height="270" rx="17"/>
  </clipPath>
  <clipPath id="cardclipg-light">
    <rect x="640" y="44" width="312" height="188" rx="16"/>
  </clipPath>
</defs>

<style>
  .caret-light   { animation: blink-light 1.05s steps(1,end) infinite; }
  .ping-light    { transform-box: fill-box; transform-origin: center;
                     animation: ping-light 2.4s cubic-bezier(0,0,.2,1) infinite; }
  .pulse-light   { animation: pulse-light 2.4s ease-in-out infinite; }
  .sweep-light   { animation: sweep-light 5.5s linear infinite; }
  .ring-light    { animation: ring-light 3.2s ease-in-out infinite; }
  @keyframes blink-light   { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
  @keyframes ping-light    { 0% { transform: scale(1); opacity: .75; }
                               70%,100% { transform: scale(2.9); opacity: 0; } }
  @keyframes pulse-light   { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes sweep-light   { 0% { transform: translateX(-180px); }
                               100% { transform: translateX(1030px); } }
  @keyframes ring-light    { 0%,100% { stroke-opacity: .28; }
                               50% { stroke-opacity: .85; } }
  @media (prefers-reduced-motion: reduce) {
    .caret-light, .ping-light, .pulse-light, .sweep-light, .ring-light { animation: none; }
  }
</style>

<g clip-path="url(#frameg-light)">
  <rect width="1000" height="272" fill="url(#bgg-light)"/>
  <rect width="1000" height="272" fill="url(#gridg-light)" opacity="0.11"/>
  <ellipse cx="140" cy="24" rx="330" ry="210" fill="url(#glowAg-light)"/>
  <ellipse cx="890" cy="296" rx="300" ry="180" fill="url(#glowBg-light)"/>
  <!-- 底部扫光 -->
  <rect class="sweep-light" x="0" y="269" width="180" height="3"
        fill="url(#sweepg-light)" opacity="0.07"/>
</g>
<rect x="1" y="1" width="998" height="270" rx="17" fill="none"
      stroke="#d7e2f3" stroke-width="2"/>

<!-- 归一化：11 标 -->
<rect x="48" y="44" width="60" height="60" rx="15" fill="url(#brandg-light)"/>
<text x="78.0" y="85.0" font-size="29"
      font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#ffffff" text-anchor="middle"
      letter-spacing="-1">11</text>

<!-- 名称与身份：名字必须用 SANS —— 等宽栈下 llwan 与 11wan 字形完全相同，会读错 -->
